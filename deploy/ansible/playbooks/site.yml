---
- name: Deploy cup on vm-app
  hosts: app
  remote_user: deploy-cup
  become: false
  roles:
  - role: cup_deploy
  - role: haproxy_vhost
    vars:
      vhost_app_name: cup
      vhost_domains:
      - "{{ cup_public_host }}"
      vhost_upstreams:
      - 127.0.0.1:3000
      vhost_healthcheck_path: /api/v1/healthz
      vhost_enable_acme: true