---
- name: Install PostgreSQL
  ansible.builtin.package:
    name: postgresql
    state: present

- name: Read postgresql.conf path
  ansible.builtin.command: psql -tAc "SHOW config_file"
  become: true
  become_user: postgres
  changed_when: false
  register: postgres_shared_host_config

- name: Listen on localhost and the data host
  ansible.builtin.lineinfile:
    path: "{{ postgres_shared_host_config.stdout | trim }}"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '127.0.0.1,{{ ansible_host }}'"
  notify: Restart PostgreSQL

- name: Ensure backup directory
  ansible.builtin.file:
    path: /var/backups/cup
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Install daily cup database backup
  ansible.builtin.copy:
    dest: /etc/cron.d/cup-pg-backup
    mode: "0644"
    content: |
      20 3 * * * postgres pg_dump -Fc -d {{ shared_db_name }} -f /var/backups/cup/cup-$(date +\%F).dump
