---
- name: Install HAProxy
  ansible.builtin.package:
    name: haproxy
    state: present

- name: Find the public TLS bind
  ansible.builtin.command: grep -nE 'bind .*443' /etc/haproxy/haproxy.cfg
  register: haproxy_vhost_bind_tls
  changed_when: false
  failed_when: false

- name: Find the public HTTP bind
  ansible.builtin.command: grep -nE 'bind .*80' /etc/haproxy/haproxy.cfg
  register: haproxy_vhost_bind_http
  changed_when: false
  failed_when: false
  when: haproxy_vhost_bind_tls.rc != 0

- name: Require a public HAProxy bind
  ansible.builtin.fail:
    msg: /etc/haproxy/haproxy.cfg has no bind on port 443 or 80.
  when: haproxy_vhost_bind_tls.rc != 0 and (haproxy_vhost_bind_http.rc | default(1)) != 0

- name: Route the cup host to the local web container
  ansible.builtin.blockinfile:
    path: /etc/haproxy/haproxy.cfg
    insertafter: "{{ 'bind .*443' if haproxy_vhost_bind_tls.rc == 0 else 'bind .*80' }}"
    marker: "# {mark} ANSIBLE MANAGED cup host"
    block: |
      acl host_cup hdr(host) -i {{ cup_public_host }}
      use_backend cup_web if host_cup
  notify: Reload HAProxy

- name: Add the cup web backend
  ansible.builtin.blockinfile:
    path: /etc/haproxy/haproxy.cfg
    insertafter: EOF
    marker: "# {mark} ANSIBLE MANAGED cup backend"
    block: |
      backend cup_web
          server cup_web 127.0.0.1:3000 check
  notify: Reload HAProxy
